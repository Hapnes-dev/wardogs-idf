name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The repository has no Gradle wrapper, so the action provides Gradle
      # itself. That keeps a binary jar out of the repository.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: wardogs-idf-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs the Compose UI tests against a real Android system image and pulls
      # the screenshots the tests write to the app's external files directory.
      - name: UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            adb shell wm size
            gradle connectedDebugAndroidTest
            mkdir -p screenshots
            adb shell run-as dev.hapnes.wardogsidf ls files/screenshots \
              | tr -d '\r' > /tmp/shots.txt
            cat /tmp/shots.txt
            while read -r shot; do
              [ -n "$shot" ] || continue
              adb exec-out run-as dev.hapnes.wardogsidf cat "files/screenshots/$shot" \
                > "screenshots/$shot"
            done < /tmp/shots.txt
            ls -l screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wardogs-idf-screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Upload instrumentation report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: wardogs-idf-androidtest-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
