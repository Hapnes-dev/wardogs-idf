name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The repository has no Gradle wrapper, so the action provides Gradle
      # itself. That keeps a binary jar out of the repository.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: wardogs-idf-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The keystore only ever exists as a secret and as a file on the runner.
      # Without it the build still runs, debug-signed, so R8 output stays testable.
      - name: Decode the upload keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Upload keystore decoded."
          else
            echo "::warning::No KEYSTORE_BASE64 secret set. The release build is debug-signed and Play will reject it."
          fi

      - name: Build the app bundle and a release APK
        run: gradle bundleRelease assembleRelease -PappVersionCode=${{ github.run_number }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: wardogs-idf-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  emulator:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs the Compose UI tests against a real Android system image and pulls
      # the screenshots the tests write to the app's external files directory.
      - name: UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          # Every line here is run as its own command, so no line continuations.
          script: |
            adb shell wm size
            gradle connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            mkdir -p screenshots
            adb shell run-as dev.hapnes.wardogsidf ls files/screenshots | tr -d '\r' > shots.txt
            cat shots.txt
            while read -r shot; do [ -n "$shot" ] || continue; adb exec-out run-as dev.hapnes.wardogsidf cat "files/screenshots/$shot" > "screenshots/$shot"; done < shots.txt
            ls -l screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wardogs-idf-screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Upload instrumentation report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: wardogs-idf-androidtest-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
